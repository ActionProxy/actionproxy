name: security

on:
  workflow_dispatch:
    inputs:
      npm_operation:
        description: Owner-controlled npm release operation
        required: true
        default: none
        type: choice
        options:
          - none
          - publish-latest
      npm_confirmation:
        description: Exact confirmation printed by the release runbook
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  first-run-macos:
    name: first-run concierge (macOS, Node ${{ matrix.node-version }})
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: node scripts/attest-public-checkout.mjs .
      - run: node --test scripts/first-run.test.mjs examples/chatgpt-tunnel/run-tunnel.test.mjs
        env:
          ACTIONPROXY_TEST_REAL_TTY: "1"

  verify:
    name: tests, types, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: corepack pnpm verify:tracked-checkout
      - name: Bootstrap-verify the Community boundary before installing dependencies
        run: node scripts/verify-public-export.mjs . --checkout --strict --bootstrap
      - run: corepack pnpm install --frozen-lockfile
      - name: Fully verify the Community boundary and source import closure
        run: corepack pnpm verify:oss-boundary
      - name: Check generated OpenAPI contract
        run: corepack pnpm openapi:check
      - name: Check generated configuration schemas
        run: corepack pnpm schemas:check
      - name: Validate OpenAPI and JSON Schema standards offline
        run: corepack pnpm contracts:validate
      - name: Check release version consistency
        run: corepack pnpm release:versions:check
      - name: Test isolated package consumers
        run: corepack pnpm test:consumer-conformance
      - run: corepack pnpm test
      - run: corepack pnpm lint
      - run: corepack pnpm build
      - name: Install the pinned Community Playwright browser
        if: matrix.node-version == '24'
        run: corepack pnpm --filter @actionproxy/web exec playwright install --with-deps chromium
      - name: Run generated-tree Community browser lifecycle
        if: matrix.node-version == '24'
        run: corepack pnpm test:e2e:community
      - name: Smoke packaged MCP wrapper
        if: matrix.node-version == '24'
        run: corepack pnpm smoke:mcp-package
      - name: Block high and critical dependency advisories
        if: matrix.node-version == '24'
        run: corepack pnpm supply-chain:audit
      - name: Validate runtime dependency licenses
        if: matrix.node-version == '24'
        run: corepack pnpm supply-chain:licenses
      - name: Generate and validate CycloneDX SBOM
        if: matrix.node-version == '24'
        run: corepack pnpm supply-chain:sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.node-version == '24'
        with:
          name: actionproxy-supply-chain
          path: |
            bom.json
            runtime-licenses.json
          retention-days: 14

  postgres-atomicity:
    name: postgres storage and MCP conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: actionproxy_test
          POSTGRES_PASSWORD: actionproxy
          POSTGRES_USER: actionproxy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actionproxy -d actionproxy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install SQLite CLI for zero-skip storage coverage
        run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: corepack enable
      - run: corepack pnpm verify:tracked-checkout
      - run: corepack pnpm install --frozen-lockfile
      - name: Run Postgres storage and MCP integration tests without skips
        env:
          ACTIONPROXY_TEST_POSTGRES_URL: postgres://actionproxy:actionproxy@127.0.0.1:5432/actionproxy_test
        run: corepack pnpm test:postgres:no-skip

  docker-community:
    name: Docker memory and SQLite smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm verify:tracked-checkout
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm docker:smoke:community

  codeql:
    name: codeql (public repository only)
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: node scripts/attest-public-checkout.mjs .
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - run: node scripts/attest-public-checkout.mjs .
      - name: Scan full Git history with the pinned Gitleaks CLI
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git
          --no-banner
          --no-color
          --redact
          .

  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: node scripts/attest-public-checkout.mjs .
      - name: Verify immutable action references
        run: node scripts/check-workflow-actions.mjs
      - name: Run actionlint 1.7.7
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color

  npm-release-prepare:
    name: npm release prepare (owner dispatch only)
    needs:
      - first-run-macos
      - verify
      - postgres-atomicity
      - docker-community
      - codeql
      - secret-scan
      - workflow-lint
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.npm_operation != 'none' &&
        needs['first-run-macos'].result == 'success' &&
        needs.verify.result == 'success' &&
        needs['postgres-atomicity'].result == 'success' &&
        needs['docker-community'].result == 'success' &&
        needs.codeql.result == 'success' &&
        needs['secret-scan'].result == 'success' &&
        needs['workflow-lint'].result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm verify:tracked-checkout
      - name: Bootstrap-verify the Community boundary before installing dependencies
        run: node scripts/verify-public-export.mjs . --checkout --strict --bootstrap
      - run: corepack pnpm release:versions:check
      - run: corepack pnpm install --frozen-lockfile
      - name: Fully verify the Community boundary and source import closure
        run: corepack pnpm verify:oss-boundary
      - name: Re-run isolated source-package conformance
        run: corepack pnpm test:consumer-conformance
      - name: Verify the annotated tag and build the two exact npm tarballs once
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs prepare npm-release-bundle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Consume the exact tarballs with Node 22
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs consume npm-release-bundle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Consume the exact tarballs with Node 24
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs consume npm-release-bundle
      - name: Reverify the unchanged bundle immediately before upload
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs verify npm-release-bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: actionproxy-npm-${{ github.ref_name }}-${{ github.sha }}
          path: npm-release-bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  npm-release-verify:
    name: npm artifact verification (owner dispatch only)
    needs:
      - npm-release-prepare
    if: ${{ needs['npm-release-prepare'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - name: Rebuild the reviewed SDK output for byte comparison only
        run: corepack pnpm --filter @actionproxy/sdk-js build
      - name: Rebuild the reviewed MCP output for byte comparison only
        run: corepack pnpm --filter @actionproxy/mcp-wrapper build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: actionproxy-npm-${{ github.ref_name }}-${{ github.sha }}
          path: npm-release-bundle
      - name: Byte-compare the exact artifact with the fresh reviewed build
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs verify npm-release-bundle

  npm-release:
    name: npm registry write (owner dispatch only)
    needs:
      - npm-release-prepare
      - npm-release-verify
    if: >-
      ${{
        needs['npm-release-prepare'].result == 'success' &&
        needs['npm-release-verify'].result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-production
    concurrency:
      group: actionproxy-npm-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          package-manager-cache: false
      - name: Verify the provenance-capable npm CLI bundled with exact Node
        run: test "$(npm --version)" = 11.6.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: actionproxy-npm-${{ github.ref_name }}-${{ github.sha }}
          path: npm-release-bundle
      - name: Publish both packages directly to latest with trusted publishing
        if: inputs.npm_operation == 'publish-latest'
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs write npm-release-bundle
        env:
          ACTIONPROXY_NPM_CONFIRMATION: ${{ inputs.npm_confirmation }}
          ACTIONPROXY_NPM_OPERATION: publish-latest
          ACTIONPROXY_NPM_TARGET_TAG: latest
      - name: Verify direct publication anonymously
        run: node packages/mcp-wrapper/src/npm-release-artifacts.mjs registry-verify npm-release-bundle
        env:
          ACTIONPROXY_NPM_OPERATION: ${{ inputs.npm_operation }}
          ACTIONPROXY_NPM_TARGET_TAG: latest
